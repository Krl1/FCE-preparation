<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCE Trener</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app.title">FCE&nbsp;Trener</h1>
    <nav class="tabs">
      <button class="tab is-active" data-view="practice" data-i18n="tab.practice">Ćwicz</button>
      <button class="tab" data-view="external" data-i18n="tab.external">Sprawdź z zewnątrz</button>
      <button class="tab" data-view="errors" data-i18n="tab.errors">Moje błędy</button>
    </nav>
    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang is-active" data-lang="pl">PL</button>
      <button class="lang" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <!-- WIDOK: ĆWICZ -->
    <section id="view-practice" class="view is-active">
      <div class="card">
        <div class="row">
          <label><span data-i18n="practice.type">Typ ćwiczenia</span>
            <select id="practice-type"></select>
          </label>
          <label><span data-i18n="practice.topic">Temat (opcjonalnie)</span>
            <select id="practice-topic"></select>
          </label>
          <button id="btn-generate" class="primary" data-i18n="btn.generate">Generuj zadanie</button>
        </div>
      </div>

      <div id="exercise-area" class="card hidden">
        <p class="muted" id="exercise-topic"></p>
        <p class="instructions" id="exercise-instructions"></p>
        <div class="question" id="exercise-question"></div>
        <div id="answer-area"></div>
        <button id="btn-grade" class="primary" data-i18n="btn.grade">Sprawdź odpowiedź</button>
      </div>

      <div id="practice-result" class="card result hidden"></div>
    </section>

    <!-- WIDOK: SPRAWDŹ Z ZEWNĄTRZ -->
    <section id="view-external" class="view">
      <div class="card">
        <p class="muted" data-i18n="external.intro">Wklej zadanie z książki lub od korepetytora oraz swoją odpowiedź — sprawdzę je i zapiszę błędy.</p>
        <label><span data-i18n="external.type">Typ ćwiczenia</span>
          <select id="external-type"></select>
        </label>
        <label id="external-keyword-wrap" class="hidden"><span data-i18n="external.keyword">Słowo-klucz (key word)</span>
          <input id="external-keyword" type="text" />
        </label>
        <label><span data-i18n="external.question">Treść zadania</span>
          <textarea id="external-question" rows="4" data-i18n-ph="external.question.ph" placeholder="Wklej treść / polecenie zadania…"></textarea>
        </label>
        <label><span data-i18n="external.answer">Twoja odpowiedź</span>
          <textarea id="external-answer" rows="4" data-i18n-ph="external.answer.ph" placeholder="Wpisz swoją odpowiedź…"></textarea>
        </label>
        <button id="btn-grade-external" class="primary" data-i18n="btn.gradeExternal">Sprawdź</button>
      </div>
      <div id="external-result" class="card result hidden"></div>
    </section>

    <!-- WIDOK: MOJE BŁĘDY -->
    <section id="view-errors" class="view">
      <div class="card">
        <h2 data-i18n="errors.weak">Słabe punkty</h2>
        <div id="stats" class="stats"></div>
      </div>
      <div class="card">
        <div class="row">
          <h2 data-i18n="errors.journal">Dziennik błędów</h2>
          <button id="btn-refresh-errors" data-i18n="btn.refresh">Odśwież</button>
        </div>
        <div id="errors-list"></div>
      </div>
    </section>
  </main>

  <div id="loader" class="loader hidden"><div class="spinner"></div><span id="loader-text">Pracuję…</span></div>

  <script src="/app.js"></script>
</body>
</html>
